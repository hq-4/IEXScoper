[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iexscoper"
version = "0.1.0"
description = "IEXScoper: ingestion and analytics for IEX data (aggregator per-second per-symbol)."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "IEXScoper"}
]
dependencies = [
  "polars>=1.7.0",
  "pyarrow>=15.0.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
iexscoper = "src.framework.cli:main"

[dependency-groups]
dev = [
  "pytest>=7.0",
  "requests>=2.25.1",
  "ruff>=0.6.0",
  "bandit>=1.7.0",
  "tqdm>=4.62.3",
  "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
minversion = "7.0"
# "-n auto" (pytest-xdist) runs the suite across all available CPU cores. Safe here:
# every test's file I/O is scoped to the `tmp_path` fixture, nothing chdirs the process,
# and no test mutates a shared real path (`reports/`, `data/`) or unguarded env var.
addopts = "-q -n auto"

[tool.bandit]
skips = ["B101"]
